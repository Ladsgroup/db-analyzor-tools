<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://tools-static.wmflabs.org/cdnjs/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <title>{% block title %}Drift tracker{% endblock %}</title>
    <style>
        body { background: #f8f9fa; }
        .drift summary { cursor: pointer; }
        .drift.untracked { border-left: 4px solid var(--bs-danger); }
        .drift.tracked { border-left: 4px solid var(--bs-secondary); }
        .stat .value { font-size: 1.75rem; font-weight: 600; line-height: 1.2; }
        code.drift-code { font-size: .8rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Drift tracker</a>
        <form class="d-flex" onsubmit="return false">
            <label class="visually-hidden" for="category-nav">Category</label>
            <select id="category-nav" class="form-select form-select-sm"
                    onchange="if (this.value) location.href = this.value">
                <option value="">Go to category…</option>
                {% for c in categories %}
                <option value="{{ url_for('report', category=c) }}" {% if c == category %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </form>
    </div>
</nav>

<main class="container my-4">
    {% block content %}{% endblock %}
</main>

<footer class="container pb-4 small text-muted">
    <hr>
    <a class="link-secondary" href="https://wikitech.wikimedia.org">wikitech.wikimedia.org</a>
    &middot;
    <a class="link-secondary" href="https://phabricator.wikimedia.org/project/board/5350/">Report issues</a>
    &middot;
    <a class="link-secondary" href="https://github.com/Ladsgroup/db-analyzor-tools">Source code</a>
</footer>
</body>
</html>
